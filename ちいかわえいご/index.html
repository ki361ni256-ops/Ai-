<title>ちいかわ えいごランド</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: ちいかわ がくしゅうランドと おなじ 絵本の 1れつ。なかまが いつも 画面に いて、こたえは 大きく タップしやすく。英語は まるい Fredoka で 目立たせる。 */
:root{
  --bg:#fff4ea; --paper:#ffffff; --ink:#4a3b33; --ink2:#8f7b6b; --line:#f1ddcb;
  --pink:#ffa3ba; --pink-d:#e46f8e; --mint:#a6e0cc; --mint-d:#3fa889;
  --sky:#b3d4f7; --sky-d:#4f88c9; --yellow:#ffe49e; --yellow-d:#d9a521; --lav:#d6cbf5; --lav-d:#7b62c9;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --en:"Fredoka","Zen Maru Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:700;
  background-image:radial-gradient(var(--line) 1.6px,transparent 1.7px);background-size:26px 26px;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px}
button{font-family:inherit;font-weight:900;color:var(--ink);cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--sky-d);outline-offset:3px}
.en{font-family:var(--en)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:31}
.top,.quizhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin:-14px -10px 0;padding:10px 10px 8px;background:var(--bg);border-bottom:3px solid var(--line);border-radius:0 0 22px 22px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--line);border-radius:999px;padding:6px 14px;font-size:17px;font-family:var(--en);white-space:nowrap}
.chip .s{color:var(--yellow-d)}
.iconbtn{background:var(--paper);border:3px solid var(--line);border-radius:999px;min-width:48px;height:48px;padding:0 14px;font-size:16px;white-space:nowrap}
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;cursor:pointer;
  background-image:radial-gradient(var(--line) 1.6px,transparent 1.7px);background-size:26px 26px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.splash .trio{display:flex;gap:6px;justify-content:center}.splash .trio .ch{width:min(28vw,120px)}
.splash .go,.splash .whos button{background:var(--pink-d);color:#fff;border-radius:999px;padding:16px 30px;font-size:22px;box-shadow:0 5px 0 #c04f6f}
.splash .whos{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.splash small{color:var(--ink2);font-size:14px}
.logo{text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.logo h1{margin:0;font-size:clamp(24px,7vw,34px);font-weight:900;letter-spacing:.04em;line-height:1.2;text-wrap:balance}
.logo h1 .p{color:var(--pink-d)}.logo h1 .m{color:var(--mint-d)}.logo h1 .b{color:var(--sky-d)}
.logo .abc{font-family:var(--en);font-size:15px;color:var(--ink2);letter-spacing:.12em}
.ch{width:112px;position:relative}.ch svg{width:100%;height:auto;display:block}
.bob{animation:bob 2.4s ease-in-out infinite}.bob.d1{animation-delay:.3s}.bob.d2{animation-delay:.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.jump{animation:jump .55s ease}
@keyframes jump{0%{transform:none}35%{transform:translateY(-22px) scale(1.06)}70%{transform:scale(.97,1.03)}100%{transform:none}}
.shake{animation:shake .45s ease}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.panel{background:var(--paper);border:3px solid var(--line);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-size:19px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h2 small{font-family:var(--en);font-size:17px;color:var(--pink-d)}
.sub,.note{font-size:14px;color:var(--ink2);margin:0;line-height:1.7}
.charbtn{background:var(--paper);border:3px solid var(--line);border-radius:26px;padding:10px 14px;display:flex;align-items:center;gap:12px;text-align:left}
.charbtn .ch{width:84px;flex:none}.charbtn .cb{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.charbtn .say{font-size:17px;line-height:1.5}
.charbtn .chg{font-size:13px;color:var(--pink-d);background:#fff0f4;border-radius:999px;padding:3px 10px;align-self:flex-start}
.gradechip,.namechip{background:var(--paper);border:3px solid var(--line);border-radius:999px;padding:6px 12px;font-size:16px;height:46px}
.today{border-color:var(--pink-d);border-width:4px;box-shadow:0 6px 0 rgba(228,111,142,.25)}
.today.alldone{border-color:var(--mint-d);box-shadow:0 6px 0 rgba(63,168,137,.25)}
.todo{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:3px solid var(--line);border-radius:22px;padding:12px 14px;box-shadow:0 5px 0 var(--line)}
.todo:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.todo .ic{width:52px;height:52px;border-radius:16px;background:var(--yellow);display:grid;place-items:center;font-size:26px;flex:none}
.todo .t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}.todo b{font-size:19px;line-height:1.3}.todo .t span{font-size:14px;color:var(--ink2)}
.todo .go{flex:none;font-size:20px;color:var(--pink-d)}
.todo.done{background:var(--mint);border-color:transparent;box-shadow:none}.todo.done .ic{background:#fff}.todo.done .go{color:var(--mint-d);font-size:15px}
.owari{background:var(--yellow);border-radius:20px;padding:14px;text-align:center;font-size:24px;display:flex;flex-direction:column;gap:6px}
.owari small{font-size:15px;line-height:1.6}
.sec-title{margin:6px 0 0;font-size:22px;text-align:center}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:flex;align-items:center;gap:14px;text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:12px 16px;box-shadow:0 5px 0 var(--line)}
.mode:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.mode .ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:26px;flex:none}
.mode .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.mode .t b{font-size:20px}.mode .t span{font-size:14px;color:var(--ink2)}
.mode .best{font-family:var(--en);font-size:14px;color:var(--yellow-d);flex:none;text-align:right}
.mode .miss{font-size:13px;color:var(--pink-d)!important}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.smallbtn{border-radius:22px;padding:14px 8px;font-size:17px;background:var(--paper);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.4;box-shadow:0 4px 0 var(--line);text-align:center}
.reviewbtn{background:var(--mint);border-radius:24px;padding:14px 16px;font-size:20px;box-shadow:0 6px 0 rgba(74,59,51,.18)}
.parentbtn{align-self:center;font-size:15px}
.rank .row1{display:flex;align-items:center;gap:12px}.rank .em{font-size:42px;line-height:1}.rank .ttl{font-size:21px;font-weight:900}
.meter{height:14px;border-radius:7px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--pink-d);border-radius:7px}
.week .wtop{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.week .wtop b{font-family:var(--en);font-size:30px}.week .wtop b small{font-size:16px;color:var(--ink2)}
.week .meter i{background:var(--yellow-d)}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--line);border-radius:12px;padding:4px 0;font-size:12px;min-width:0}
.wd b{font-family:var(--en);font-size:17px}.wd.today{border-color:var(--pink-d);background:#fff0f4}.wd.full{background:var(--yellow);border-color:var(--yellow-d)}.wd.future{opacity:.5}
.quizhead{justify-content:flex-start}
.prog{flex:1;display:flex;gap:4px}.prog i{flex:1;height:12px;border-radius:6px;background:var(--line)}
.prog i.ok{background:var(--mint-d)}.prog i.ng{background:var(--pink)}.prog i.now{background:var(--sky-d)}
.talk{display:flex;align-items:flex-end;gap:8px}.talk .ch{width:96px;flex:none}
.bubble{position:relative;background:var(--paper);border:3px solid var(--line);border-radius:20px;padding:10px 14px;font-size:18px;min-height:28px;flex:1;margin-bottom:24px;line-height:1.5}
.bubble::before{content:"";position:absolute;left:-12px;bottom:14px;border:9px solid transparent;border-right-color:var(--line);border-left:0}
.q{background:var(--paper);border:3px solid var(--line);border-radius:28px;padding:58px 14px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;position:relative}
.q .say{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.q .tag{font-size:15px;background:var(--yellow);border-radius:999px;padding:4px 12px;position:absolute;left:12px;top:16px;max-width:calc(100% - 200px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask{font-size:19px;color:var(--ink2);margin:0}
.emoji{font-size:clamp(76px,22vw,104px);line-height:1.1}
.word{font-family:var(--en);font-weight:600;font-size:clamp(36px,11vw,54px);line-height:1.2;color:var(--sky-d);overflow-wrap:anywhere}
.ja{font-size:24px}
.letter{font-family:var(--en);font-weight:600;font-size:clamp(96px,30vw,140px);line-height:1;color:var(--pink-d)}
.bigsay{width:120px;height:120px;border-radius:50%;background:var(--sky);font-size:52px;box-shadow:0 6px 0 var(--sky-d)}
.bigsay:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sky-d)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choices.one{grid-template-columns:1fr}
.choice{background:var(--paper);border:4px solid var(--line);border-radius:22px;min-height:76px;font-size:24px;padding:8px 10px;box-shadow:0 6px 0 var(--line);transition:transform .1s,box-shadow .1s;min-width:0;overflow-wrap:anywhere}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.choice.cpic{font-size:56px;min-height:104px;line-height:1}
.choice.cen{font-family:var(--en);font-weight:600;font-size:26px}
.choice.ok{background:#e3f7ef;border-color:var(--mint-d);box-shadow:0 6px 0 var(--mint-d)}
.choice.ng{background:#f6f0ec;border-color:var(--line);color:#c2b2a5;text-decoration:line-through;box-shadow:none;transform:translateY(4px)}
.choice.ng.cpic{opacity:.35;text-decoration:none}
.learn{background:#eef8f4;border:3px solid var(--mint-d);border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.learn b{font-size:18px;color:var(--mint-d)}.learn .full{font-size:26px;font-family:var(--en);line-height:1.4}.learn p{margin:0;font-size:17px;line-height:1.6}
.pill{border-radius:999px;padding:14px 26px;font-size:20px;box-shadow:0 5px 0 rgba(74,59,51,.18)}
.pill.pink{background:var(--pink)}.pill.mint{background:var(--mint)}.pill.sky{background:var(--sky)}.pill.yellow{background:var(--yellow)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#order{display:flex;flex-direction:column;gap:14px}
.ordline{min-height:64px;border:3px dashed var(--line);border-radius:18px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:var(--paper)}
.chipsrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chipw{background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:10px 14px;font-size:24px;font-family:var(--en);font-weight:600;box-shadow:0 4px 0 var(--line);min-width:52px}
.chipw.placed{background:#fff0f4;border-color:var(--pink-d);box-shadow:none}.chipw:disabled{opacity:.25}
.result{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.result h2{margin:0;font-size:30px}
.score{font-family:var(--en);font-size:64px;font-weight:700;line-height:1}.score small{font-size:24px}
.stars{font-size:22px;letter-spacing:2px;color:var(--yellow-d);max-width:100%;overflow-wrap:anywhere}
.ptsbox{background:var(--yellow);border-radius:24px;padding:14px 22px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:16px}
.ptsbox b{font-family:var(--en);font-size:40px;line-height:1}
.newsticker{background:var(--yellow);border-radius:24px;padding:14px 22px;display:flex;align-items:center;gap:14px;font-size:18px;text-align:left}
.newsticker .e{font-size:50px}
.book{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cell{aspect-ratio:1;max-width:100%;background:var(--paper);border:3px solid var(--line);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px}
.cell .e{font-size:clamp(28px,9vw,40px);line-height:1}.cell.lock{border-style:dashed;color:#d6c4b5}.cell.lock .e{filter:grayscale(1) opacity(.18)}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cat{flex:none;border:3px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;font-size:16px}
.cat[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.words{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wcard{position:relative;background:var(--paper);border:3px solid var(--line);border-radius:20px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 var(--line);min-width:0}
.wcard .e{font-size:34px;line-height:1.2;min-height:40px}.wcard .w{font-family:var(--en);font-weight:600;font-size:17px;overflow-wrap:anywhere}.wcard small{font-size:12px;color:var(--ink2);font-weight:500}
.wcard.done{border-color:var(--mint-d)}.wcard.done::after{content:"✓";position:absolute;right:8px;top:4px;color:var(--mint-d);font-size:18px}
.search{width:100%;box-sizing:border-box;border:3px solid var(--line);border-radius:999px;padding:12px 18px;font-family:inherit;font-size:18px;font-weight:700;color:var(--ink);background:var(--paper)}
.dict{background:var(--paper);border:3px solid var(--line);border-radius:28px;padding:20px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.dict .e{font-size:96px;line-height:1}.dict .catname{font-size:14px;color:var(--ink2)}
.story{display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:left}
.sline{display:flex;align-items:flex-start;gap:8px;background:var(--bg);border-radius:16px;padding:8px 10px}
.sline .ws{flex:1;min-width:0;font-family:var(--en);font-size:24px;font-weight:500;line-height:1.6;display:flex;flex-wrap:wrap;gap:0 2px}
.sline .ws button{font:inherit;padding:6px 6px;min-width:34px;min-height:44px;border-radius:10px}.sline .ws button.on{background:var(--yellow)}
.sline .ln{flex:none;width:42px;height:42px;border-radius:50%;background:var(--sky);font-size:18px}
.sline.now{outline:3px solid var(--sky-d)}
.gloss{min-height:30px;font-size:19px;color:var(--lav-d);text-align:center}
.buddies{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.buddy{border:3px solid var(--line);border-radius:20px;padding:6px 4px 8px;background:var(--paper);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px}
.buddy .ch{width:min(84px,22vw)}.buddy[aria-pressed="true"]{border-color:var(--pink-d);background:#fff0f4}
.gradegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gradebtn{background:var(--paper);border:4px solid var(--line);border-radius:20px;padding:12px 4px;font-size:18px;box-shadow:0 4px 0 var(--line)}
.gradebtn.on{border-color:var(--sky-d);background:#eef5ff}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--bg);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--en);font-size:26px;font-variant-numeric:tabular-nums}.tile span{font-size:12px;color:var(--ink2)}
.hbar{display:grid;grid-template-columns:8.5em 1fr 3em;gap:8px;align-items:center;font-size:14px}
.hbar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbar .meter{height:12px}.hbar .meter i{background:var(--sky-d)}
.hbar .n{font-family:var(--en);text-align:right;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:4px;height:110px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;font-size:10px;color:var(--ink2);min-width:0}
.bars i{width:100%;background:var(--sky-d);border-radius:6px 6px 2px 2px;min-height:2px}.bars em{font-style:normal;font-family:var(--en);font-size:11px;color:var(--ink)}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:16px}
.sw{width:58px;height:34px;border-radius:99px;background:var(--line);position:relative;flex:none}
.sw i{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--mint-d)}.sw[aria-checked="true"] i{left:28px}
.okline{background:#e3f7ef;border:3px solid var(--mint-d);border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.6}
.warn{background:#fff3d6;border:3px solid var(--yellow-d);border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.6}
.prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.prow input{flex:1;min-width:120px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto;width:100%}
.kp button{background:var(--paper);border:3px solid var(--line);border-radius:18px;height:60px;font-family:var(--en);font-size:28px}
.gateans{font-family:var(--en);font-size:40px;min-height:54px;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti i{position:absolute;top:-20px;width:12px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:90px;pointer-events:none;z-index:21;animation:pop .8s ease forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}

.coursebtn{background:var(--sky-d);color:#fff;border-radius:26px;padding:18px;display:flex;align-items:center;gap:14px;text-align:left;box-shadow:0 6px 0 rgba(74,59,51,.3)}
.coursebtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(74,59,51,.3)}
.coursebtn .ic{font-size:36px}.coursebtn b{display:block;font-size:23px;color:#fff}.coursebtn span span{font-size:14px;opacity:.95;color:#fff}
.path{display:flex;flex-direction:column;gap:2px;margin-left:24px;border-left:4px dotted var(--line);padding:4px 0}
.pnode{display:flex;gap:12px;align-items:center;text-align:left;padding:8px 6px 8px 0;background:none}
.pnode .dot{flex:none;width:48px;height:48px;margin-left:-26px;border-radius:50%;background:var(--paper);border:3px solid var(--line);display:grid;place-items:center;font-size:22px}
.pnode.ok .dot{background:var(--yellow);border-color:var(--yellow-d)}

const LATEST=['name','grade','buddy','sound','theme','autoRead','rate','miss','srs','learned','yen','voice','openAll'];
function mergeVal(a,b){if(typeof a==='number'&&typeof b==='number')return Math.max(a,b);
  if(Array.isArray(a)&&Array.isArray(b))return [...new Set([...a,...b])];
  if(a&&b&&typeof a==='object'&&typeof b==='object'){const o={...a};for(const k in b)o[k]=k in a?mergeVal(a[k],b[k]):b[k];return o}
  return a!=null?a:b}
function mergeSave(a,b){const newer=(b.upd||0)>(a.upd||0)?b:a,o={};
  for(const k of new Set([...Object.keys(a),...Object.keys(b)]))o[k]=LATEST.includes(k)?(k in newer?newer[k]:(a[k]!=null?a[k]:b[k])):mergeVal(a[k],b[k]);
  o.upd=Math.max(a.upd||0,b.upd||0);return o}

const CLOUD={db:null,uid:null,state:'wait',last:0,pushed:{},timer:null,busy:Promise.resolve()};
const cdoc=k=>CLOUD.db.doc('data/users/'+CLOUD.uid+'/'+k);
async function cloudInit(){
  setTimeout(()=>{if(CLOUD.state==='wait'){CLOUD.state='off';if(st.screen==='parent')parent()}},12000);
  try{if(!window.claude||!window.claude.use){CLOUD.state='off';return}
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);if(!db||!user){CLOUD.state='off';return}
    const id=await user.id();if(!id){CLOUD.state='off';return}CLOUD.db=db;CLOUD.uid=id;
    await cloudPull();CLOUD.state='ok';cloudPush(true)}catch(e){CLOUD.state='off'}}
async function cloudPull(){if(!CLOUD.db)return;
  const ms=await cdoc('meta').get(),m=ms.exists?ms.data():{},del=new Set([...(root.del||[]),...(m.del||[])]);root.del=[...del];
  let got=false;
  for(const id of new Set([...Object.keys(root.profiles),...(m.ids||[])])){if(del.has(id)){delete root.profiles[id];continue}
    const s=await cdoc('p_'+id).get();if(!s.exists)continue;const body=s.data();CLOUD.pushed[id]=JSON.stringify(body);
    const cur=root.profiles[id],mg=cur?mergeSave(cur,body):Object.assign(newSave(id),body);
    if(JSON.stringify(mg)!==JSON.stringify(cur)){got=true;root.profiles[id]=mg}}
  if(!root.profiles[root.active])root.active=Object.keys(root.profiles)[0]||root.active;
  if(!root.profiles[root.active]){root.profiles[root.active]=newSave(root.active)}
  save=root.profiles[root.active];
  if(got){try{localStorage.setItem(KEY,JSON.stringify(root))}catch(e){}if(['home','parent'].includes(st.screen))(st.screen==='home'?home:parent)()}}
function cloudPush(now){if(!CLOUD.db)return;clearTimeout(CLOUD.timer);if(!now){CLOUD.timer=setTimeout(()=>cloudPush(true),2500);return}
  CLOUD.busy=CLOUD.busy.then(async()=>{try{
    for(const id of Object.keys(root.profiles)){const body=JSON.stringify(root.profiles[id]);if(CLOUD.pushed[id]===body)continue;
      await cdoc('p_'+id).set(JSON.parse(body));CLOUD.pushed[id]=body}
    const mb=JSON.stringify({ids:Object.keys(root.profiles),del:root.del||[]});if(CLOUD.pushed._m!==mb){await cdoc('meta').set(JSON.parse(mb));CLOUD.pushed._m=mb}
    CLOUD.last=Date.now();CLOUD.state='ok'}catch(e){const c=String(e&&e.code||e);if(['not_granted','revoked','invalid_argument'].includes(c))CLOUD.state='off'}})}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&CLOUD.timer)cloudPush(true)});

  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=freq;const t=ac.currentTime+start;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.05);if(keep)themeNodes.push(o)}catch(e){}}

  {id:'hear',name:'きいて わかる',ic:'🎧',min:2,color:'var(--sky)',sub:'えいごの ぶんを きいて いみを えらぶ'},
  {id:'talk',name:'かいわ',ic:'💬',min:1,color:'var(--yellow)',sub:'しつもんを きいて、こたえて、いってみる'}
];
const MODE=Object.fromEntries(MODES.map(m=>[m.id,m]));

const nCh=()=>4;

const uNow=()=>Math.min(Math.floor(save.cp/3),UNITS.length-1);
const talkKeys=()=>[...new Set(UNITS.slice(0,Math.max(3,uNow()+1)).map(u=>u.d))];
function poolFor(mode){const b=bNow();
  if(mode==='talk')return talkKeys();
  if(mode==='abc')return LET.map(l=>l.l);
  if(mode==='order'||mode==='hear')return SENTS.map((s,i)=>i).filter(i=>SENTS[i][2]<=b&&(mode==='hear'||SENTS[i][2]>=Math.max(1,b-1)));
  let p=WORDS.filter(w=>w.b<=b);
  if(mode==='listen'||mode==='say'||mode==='speak')p=p.filter(w=>w.e);
  if(mode==='spell')p=p.filter(w=>/^[a-z]+$/.test(w.en)&&w.en.length>=3&&w.en.length<=(b===2?6:9));
  return p.map(w=>w.en)}
function distract(w,n,need){const ok=x=>x.en!==w.en&&x.ja!==w.ja&&(!need||x[need])&&x.b<=Math.max(bNow(),w.b);
  let p=shuffle(WORDS.filter(x=>x.c===w.c&&ok(x)));if(p.length<n)p=p.concat(shuffle(WORDS.filter(x=>x.c!==w.c&&ok(x))));
  const out=[];for(const x of p){if(out.length>=n)break;if(need==='e'&&out.some(o=>o.e===x.e))continue;if(need==='e'&&x.e===w.e)continue;out.push(x)}return out}
// 1もんを つくる。item は ことば(英語)、もじ、ぶんの ばんごう。
function makeQ(mode,item,sub){
  const key=mode+':'+item+(sub?':'+sub:'');
  if(mode==='abc'){const L=LET.find(x=>x.l===item);sub=sub||(bNow()===1&&Math.random()<.5?'case':Math.random()<.6?'first':'case');
    if(sub==='first'){const ds=shuffle(LET.filter(x=>x.l!==L.l)).slice(0,nCh()-1);const ch=shuffle([L,...ds]);
      return {mode,item,sub,key:mode+':'+item+':first',type:'choice',ctype:'cen',ask:'さいしょの もじは どれ?',html:`<div class="emoji">${L.e}</div><div class="word">${L.en}</div>`,audio:L.en,
        answer:L.l,choices:ch.map(x=>x.l),choiceHTML:Object.fromEntries(ch.map(x=>[x.l,x.l.toUpperCase()+' '+x.l])),full:`${L.l.toUpperCase()} ${L.l} … ${L.e} ${L.en}`,explain:`「${L.en}(${L.ja})」は「${L.k}」の おとで はじまるよ。`}}
    const ds=shuffle(LET.filter(x=>x.l!==L.l)).slice(0,nCh()-1),ch=shuffle([L,...ds]);
    return {mode,item,sub:'case',key:mode+':'+item+':case',type:'choice',ctype:'cen',ask:'おおもじと こもじ、なかまは どれ?',html:`<div class="letter">${L.l.toUpperCase()}</div>`,audio:L.l.toUpperCase()+'. '+L.en,
      answer:L.l,choices:ch.map(x=>x.l),choiceHTML:Object.fromEntries(ch.map(x=>[x.l,x.l])),full:`${L.l.toUpperCase()} → ${L.l}`,explain:`おおもじ「${L.l.toUpperCase()}」の こもじは「${L.l}」。${L.e} ${L.en} の ${L.l} だよ。`}}
  if(mode==='order'||mode==='hear'){const s=SENTS[item],en=s[0],ja=s[1];
    if(mode==='hear'){const ds=shuffle(SENTS.filter((x,i)=>i!==item&&x[1]!==ja&&x[2]<=bNow())).slice(0,nCh()-1);const ch=shuffle([ja,...ds.map(x=>x[1])]);
      return {mode,item,key,type:'choice',ctype:'',ask:'きいた ぶんの いみは?',html:`<button class="bigsay" data-a="say" aria-label="もういちど きく">🔊</button>`,audio:en,answer:ja,choices:ch,full:en,explain:ja,one:true}}
    const mark=/[.?!]$/.test(en)?en.slice(-1):'',body=mark?en.slice(0,-1):en,ws=body.split(' ');
    let chunks=shuffle(ws);for(let t=0;t<5&&chunks.join(' ')===body;t++)chunks=shuffle(ws);
    return {mode,item,key,type:'order',join:' ',chunks,accepts:[body],ask:ja,html:`<div class="ja">${esc(ja)}</div>`,audio:en,full:en,explain:ja,mark}}
  if(mode==='talk'||mode==='tspeak'){const D=DIALOGS[item];
    if(mode==='tspeak')return {mode,item,key,type:'speak',ask:'こたえを まねして いってみよう!',html:`<div class="sub">${esc(D.q)}</div><div class="word" style="font-size:clamp(26px,8vw,38px)">${esc(D.a)}</div><div class="sub">${esc(D.aja)}</div>`,audio:D.a,full:D.a,explain:D.aja};
    const ch=shuffle([D.a,...D.x]),helper=bNow()===1;
    return {mode,item,key,type:'choice',ctype:'ctalk',one:true,ask:'なんて こたえる?',html:`<div class="word" style="font-size:clamp(26px,8vw,38px)">${esc(D.q)}</div><div class="sub">${esc(D.qja)}</div>`,audio:D.q,after:D.a,answer:D.a,choices:ch,
      choiceHTML:Object.fromEntries(ch.map(c=>[c,`<span class="en">${esc(c)}</span>${helper?`<small class="cja">${esc(c===D.a?D.aja:JA_OF[c]||'')}</small>`:''}`])),full:`${D.q} → ${D.a}`,explain:D.aja}}
  const w=WBY[item];
  if(mode==='listen'){const ch=shuffle([w,...distract(w,nCh()-1,'e')]);
    return {mode,item,key,type:'choice',ctype:'cpic',ask:'きこえた ものは どれ?',html:`<button class="bigsay" data-a="say" aria-label="もういちど きく">🔊</button>`,audio:w.en,answer:w.en,choices:ch.map(x=>x.en),choiceHTML:Object.fromEntries(ch.map(x=>[x.en,x.e])),full:`${w.e} ${w.en}`,explain:`「${w.en}」は「${w.ja}」だよ。`}}
  if(mode==='say'){const ch=shuffle([w,...distract(w,nCh()-1)]);
    return {mode,item,key,type:'choice',ctype:'cen',ask:'えいごで なんて いう?',html:`${w.e?`<div class="emoji">${w.e}</div>`:''}<div class="ja">${esc(w.ja)}</div>`,audioJa:w.ja,audio:null,after:w.en,answer:w.en,choices:ch.map(x=>x.en),full:`${w.e} ${w.en}`,explain:`「${w.ja}」は えいごで「${w.en}」。`}}
  if(mode==='meaning'){const ch=shuffle([w,...distract(w,nCh()-1)]);
    return {mode,item,key,type:'choice',ctype:'',ask:'いみは どれ?',html:`<div class="word">${esc(w.en)}</div>`,audio:w.en,answer:w.ja,choices:ch.map(x=>x.ja),full:`${w.en} = ${w.ja}`,explain:`${w.e} 「${w.en}」は「${w.ja}」という いみ。`}}
  if(mode==='spell'){const ls=w.en.split('');let chunks=shuffle(ls);for(let t=0;t<5&&chunks.join('')===w.en;t++)chunks=shuffle(ls);
    return {mode,item,key,type:'order',join:'',chunks,accepts:[w.en],ask:'もじを じゅんばんに おしてね',html:`${w.e?`<div class="emoji">${w.e}</div>`:''}<div class="ja">${esc(w.ja)}</div>`,audio:w.en,full:`${w.e} ${w.en}`,explain:`「${w.ja}」は ${w.en.split('').join(' - ')}。`}}
  if(mode==='speak')return {mode,item,key,type:'speak',ask:'きいたら まねして いってみよう!',html:`<div class="emoji">${w.e}</div><div class="word">${esc(w.en)}</div><div class="sub">${esc(w.ja)}</div>`,audio:w.en,full:`${w.e} ${w.en}`,explain:''};
}
const JA_OF=Object.assign({},XJA);Object.values(DIALOGS).forEach(D=>{JA_OF[D.a]=D.aja});
const itemLabel=(mode,item)=>mode==='abc'?item.toUpperCase()+' '+item:(mode==='order'||mode==='hear')?SENTS[item][0]:item;

/* ---------- ふくしゅうの しくみ ----------
   はじめて せいかいした もんだいは 1・3・7・14・30にち あとに また でる(日を あけた ふくしゅう)。
   まちがえた もんだいは「にがて」に はいり、2かい つづけて せいかいで こくふく。 */
const SRS_GAP=[1,3,7,14,30];
function srsHit(q){const S=save.srs,m=S[q.key];
  if(q.fromSrs&&m){if(m.last===today())return;m.step++;m.last=today();if(m.step>=SRS_GAP.length)delete S[q.key];else m.due=dPlus(SRS_GAP[m.step]);return}
  if(!S[q.key]&&!q.fromBox){S[q.key]={mode:q.mode,item:q.item,sub:q.sub||'',step:0,due:dPlus(1),last:today()};
    const ks=Object.keys(S);if(ks.length>200)ks.sort((a,b)=>dNum(S[a].last)-dNum(S[b].last)).slice(0,ks.length-200).forEach(k=>delete S[k])}}
function addMiss(q){if(q.mode==='speak')return;save.miss[q.key]={mode:q.mode,item:q.item,sub:q.sub||'',ok:0};delete save.srs[q.key]}
function hitMiss(q){const m=save.miss[q.key];if(!m)return false;m.ok=(m.ok||0)+1;if(m.ok>=2){delete save.miss[q.key];return true}return false}
const missCount=id=>Object.values(save.miss).filter(m=>!id||m.mode===id).length;
const validItem=(mode,item)=>(mode==='talk'||mode==='tspeak')?!!DIALOGS[item]:MODE[mode]&&(mode==='abc'?LET.some(l=>l.l===item):(mode==='order'||mode==='hear')?!!SENTS[item]:!!WBY[item]);
function fromStore(m,flag){const q=makeQ(m.mode,m.item,m.sub||undefined);q[flag]=true;return q}
function makeRound(kind){const used=new Set(),qs=[];const add=q=>{if(q&&!used.has(q.key)){used.add(q.key);qs.push(q)}};
  if(kind==='review'){shuffle(Object.values(save.miss).filter(m=>validItem(m.mode,m.item))).slice(0,ROUND_N).forEach(m=>add(fromStore(m,'fromBox')));return qs}
  const modes=kind==='daily'?modesNow().map(m=>m.id):[kind],N=kind==='daily'?DAILY_N:ROUND_N,t=dNum(today());
  // 1) きょうが ふくしゅうの 日の もんだい 2) にがて 3) まだ やっていない ことば を じゅんに まぜる
  const due=Object.values(save.srs).filter(m=>modes.includes(m.mode)&&validItem(m.mode,m.item)&&dNum(m.due)<=t);
  shuffle(due).slice(0,Math.ceil(N*.3)).forEach(m=>add(fromStore(m,'fromSrs')));
  shuffle(Object.values(save.miss).filter(m=>modes.includes(m.mode)&&validItem(m.mode,m.item))).slice(0,2).forEach(m=>add(fromStore(m,'fromBox')));
  let guard=0;while(qs.length<N&&guard++<200){const mode=kind==='daily'?(qs.length===N-1&&modes.includes('speak')?'speak':pick(modes.filter(x=>x!=='speak'||Math.random()<.3))):kind;
    const pool=poolFor(mode),seen=k=>save.stats['i:'+mode+':'+k];
    const fresh=pool.filter(k=>!seen(k)),cand=fresh.length&&Math.random()<.7?fresh:pool;add(makeQ(mode,pick(cand)))}
  return qs}

   say(){if(st.screen==='quiz')playQ(false)},slow(){if(st.screen==='quiz')playQ(true)},
   said(){if(st.lock)return;logSpeak();onCorrect()},
   rec(){if(st.screen==='learn'){recSay(UNITS[st.u].w[st.i],()=>learnNext(false));return}if(st.lock)return;const q=st.qs[st.i];recSay(q.audio,()=>{if(!st.lock)onCorrect()})},
   ans(){answer(b)},chunk(){chunkTap(+k)},unchunk(){if(st.lock)return;st.ord.splice(+k);renderOrder()},next(){next()},
   story(){story(k)},line(){const s=st.s;document.querySelectorAll('.sline').forEach(x=>x.classList.remove('now'));document.getElementById('ln'+k).classList.add('now');sayEn(s.lines[+k],save.rate*.95)},
   readall(){readAll()},squiz(){squiz()},sans(){sAnswer(b)},
   gw(){document.querySelectorAll('.ws button.on').forEach(x=>x.classList.remove('on'));b.classList.add('on');const g=glossOf(k),w=k.replace(/[^A-Za-z'-]/g,'');document.getElementById('gloss').textContent=w+(g?' = '+g:'');sayEn(w)},
   dcat(){dCat=k;dict()},word(){word(k)},wsay(){sayEn(st.w.en)},wslow(){sayEn(st.w.en,.5)},
   wknow(){const en=st.w.en,L=save.learned;if(L.includes(en))save.learned=L.filter(x=>x!==en);else{L.push(en);save.stars++;popStar('⭐')}persist();word(en)},
   pick(){switchProfile(k);st.screen==='parent'?parent():home()},
   tog(){save[k]=!save[k];persist();parent()},rate(){save.rate=+k;persist();parent();sayEn('Hello, Chiikawa!')},
   rename(){const v=document.getElementById('pname').value.trim().slice(0,12);save.name=v;persist();parent()},
   addp(){const id=pid();root.profiles[root.active]=save;root.profiles[id]=Object.assign(newSave(id),{grade:save.grade});switchProfile(id);parent();const n=document.getElementById('pname');if(n)n.focus()},
   delask(){delAsk=root.active;parent()},delno(){delAsk=null;parent()},
   delp(){const id=root.active;delete root.profiles[id];root.del=[...new Set([...(root.del||[]),id])];root.active=Object.keys(root.profiles)[0];save=root.profiles[root.active];delAsk=null;persist();parent()},
   resetask(){resetAsk=true;parent()},resetno(){resetAsk=false;parent()},
   reset(){const keep={name:save.name,grade:save.grade,buddy:save.buddy,sound:save.sound,theme:save.theme,autoRead:save.autoRead,rate:save.rate};
     // リセットは ほかの たんまつの きろくと あわさって もどらないよう、新しい id に する
     const old=root.active,id=pid();delete root.profiles[old];root.del=[...new Set([...(root.del||[]),old])];root.profiles[id]=Object.assign(newSave(id),keep);root.active=id;save=root.profiles[id];resetAsk=false;persist();parent()}
  };
  if(H[a]){if(!['ans','chunk','sans','said'].includes(a))sfx.tap();H[a]()}});

splash();home();cloudInit();
})();
</script>
